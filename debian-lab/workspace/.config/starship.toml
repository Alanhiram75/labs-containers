format = """\
[╭╴](fg:arrow)\
$username\
$directory\
$time\
(\
    $git_branch\
    $git_status\
)\
$cmd_duration
[╰─](fg:arrow)$character\
"""

add_newline = true

palette = "debian"

[palettes.debian]
# Semantics
arrow      = "#d70a53"  # Debian Red
os         = "#42484b"  # surface1
os_admin   = "#d70a53"  # Debian Red
directory  = "#42484b"  # surface1
time       = "#42484b"  # surface1
node       = "#d70a53"  # Debian Red
git        = "#42484b"  # surface1
git_status = "#d70a53"  # Debian Red
python     = "#d70a53"  # Debian Red
rust       = "#d70a53"  # Debian Red
duration   = "#42484b"  # surface1
text_color = "#e3e2e3"  # text
text_light = "#e3e2e3"  # text

# Standard colors
blue    = "#d3c0dc"
red     = "#d70a53"
green   = "#b1cad8"
yellow  = "#bfc8ce"
cyan    = "#bfc8ce"
magenta = "#b1cad8"
white   = "#e3e2e3"
black   = "#42484b"

# Text shades
text     = "#e3e2e3"
subtext1 = "#e3e2e3"
subtext0 = "#8c9195"

# Surface shades
overlay2 = "#8c9195"
overlay1 = "#8c9195"
overlay0 = "#42484b"
surface2 = "#42484b"
surface1 = "#42484b"
surface0 = "#121314"
base     = "#121314"
mantle   = "#121314"
crust    = "#121314"

[username]
style_user = 'os_admin'
style_root = 'os_admin'
format = '[]($style)[ Lab Debian](bg:$style fg:text_light)[]($style)'
disabled = false
show_always = true

[character]
success_symbol = "[󰍟](fg:arrow)"
error_symbol = "[󰍟](fg:red)"

[directory]
format = " [](fg:directory)[  $path ]($style)[$read_only]($read_only_style)[](fg:directory)"
truncation_length = 3
style = "fg:text_color bg:directory"
read_only_style = "fg:text_color bg:directory"
before_repo_root_style = "fg:text_color bg:directory"
truncation_symbol = "…/"
truncate_to_repo = true
read_only ="  "

[directory.substitutions]
"Escritorio" = "  "
"Documentos" = "  "
"Descargas" = "  "
"Música" = " 󰎈"
"Imágenes" = "  "
"Vídeos" = "  "
"Proyectos" = " 󰊤 "

[time]
disabled = false
format = " [](fg:time)[ $time]($style)[](fg:time)"
time_format = "%H:%M"
style = "fg:text_color bg:time"

[cmd_duration]
format = " [](fg:duration)[ $duration]($style)[](fg:duration)"
style = "fg:text_light bg:duration"
min_time = 500

[git_branch]
format = " [](fg:git)[$symbol$branch](fg:text_light bg:git)[](fg:git)"
symbol = " "

[git_status]
format = '([ ](fg:git_status)[ $all_status$ahead_behind ]($style)[](fg:git_status))'
style = "fg:text_light bg:git_status"

[package]
disabled = true

